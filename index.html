<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Reii's Rocket Dodge</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{background:#0d1117;border:2px solid #30363d;image-rendering:pixelated;max-width:96vw;max-height:80vh;touch-action:none}
p{margin:8px;color:#8b949e;font-size:13px;text-align:center}
</style></head><body>
<canvas id="c" width="320" height="480"></canvas>
<p>Geser mouse / jari atau tombol ← → untuk gerak. Klik/tap/Spasi untuk mulai.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=c.width,H=c.height;
let best=0;try{best=+localStorage.getItem('rocketBest')||0}catch(e){}
let state='menu',score=0,t=0,rocket,rocks,stars,keys={};
function reset(){rocket={x:W/2,y:H-60};rocks=[];score=0;t=0;}
stars=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2}));
function start(){reset();state='play'}
function px(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)}
function drawRocket(){const a=rocket.x,b=rocket.y;
 px(a-3,b-18,6,6,'#f85149');px(a-6,b-12,12,24,'#e6edf3');px(a-3,b-6,6,6,'#58a6ff');
 px(a-12,b+6,6,10,'#f85149');px(a+6,b+6,6,10,'#f85149');
 px(a-3,b+12,6,6+(t%6<3?6:2),'#ff9e2c');}
function loop(){
 t++;
 x.clearRect(0,0,W,H);
 for(const s of stars){s.y+=s.s*(state==='play'?1.5:.5);if(s.y>H){s.y=0;s.x=Math.random()*W}px(s.x,s.y,s.s,s.s,'#adbac7')}
 if(state==='play'){
  if(keys.ArrowLeft)rocket.x-=4;if(keys.ArrowRight)rocket.x+=4;
  rocket.x=Math.max(12,Math.min(W-12,rocket.x));
  if(t%Math.max(14,40-Math.floor(score/150))===0){const r=10+Math.random()*16;rocks.push({x:Math.random()*(W-r),y:-r,r,v:2+Math.random()*1.5+score/500})}
  for(const k of rocks){k.y+=k.v;
   if(rocket.x+8>k.x&&rocket.x-8<k.x+k.r&&rocket.y+14>k.y&&rocket.y-16<k.y+k.r){state='over';if(score>best){best=score;try{localStorage.setItem('rocketBest',best)}catch(e){}}}}
  rocks=rocks.filter(k=>k.y<H+40);
  score++;
 }
 for(const k of rocks){px(k.x,k.y,k.r,k.r,'#8b949e');px(k.x+3,k.y+3,k.r/3,k.r/3,'#6e7681')}
 if(state!=='menu')drawRocket();else{rocket=rocket||{x:W/2,y:H-60};drawRocket()}
 x.fillStyle='#e6edf3';x.font='bold 14px monospace';x.textAlign='left';
 x.fillText('SCORE '+score,8,20);x.textAlign='right';x.fillText('BEST '+best,W-8,20);x.textAlign='center';
 if(state==='menu'){x.font='bold 22px monospace';x.fillText('ROCKET DODGE',W/2,170);x.font='13px monospace';x.fillText('Tap untuk mulai',W/2,200)}
 if(state==='over'){x.font='bold 22px monospace';x.fillText('GAME OVER',W/2,170);x.font='13px monospace';x.fillText('Tap untuk main lagi',W/2,200)}
 requestAnimationFrame(loop);
}
reset();
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '&&state!=='play')start();if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=0);
function move(cx){const r=c.getBoundingClientRect();if(state==='play')rocket.x=(cx-r.left)*W/r.width}
c.addEventListener('pointermove',e=>move(e.clientX));
c.addEventListener('pointerdown',e=>{if(state!=='play')start();else move(e.clientX)});
loop();
</script></body></html>
